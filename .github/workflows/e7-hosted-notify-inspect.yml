# E7 C47 (Slice 6-P): HOSTED READ-ONLY guest-notification ADMISSION INSPECTION for ONE bound TEST guest.notify operation, running the reviewed
# scripts/e7-hosted-notify-inspect.mjs. ONE REPEATABLE READ READ ONLY transaction as the runtime app role on the shared DEV TEST database: role /
# catalog identity (exactly the reviewed schema 21 / 22 / 23) / TEST instance / intent + operation binding / the reviewed 0016 class through
# booking.list_guest_notifications / allowlisted render, latch, receipt metadata → ROLLBACK. HONEST LABEL: MANUAL hosted READ-ONLY inspection
# (workflow_dispatch + the EXISTING `e7-readonly-probe` reviewer gate). NO send / execute mode exists; no notification executor / transport / worker,
# no claim / latch / recover / release / write, no Hostaway / Stripe / Resend secret. Refunds stay manual; all five runner flags stay CLOSED.
# Default mode `preflight` = no environment, no secret, no database: focused FAKE tests (spawned by the runner) + the plan hash + the digests.
# `inspect` = main only, only after a SUCCESSFUL preflight job of the SAME dispatch SHA, and only after HEAD / tooling pin / source digest /
# closure digest / plan hash / approval re-checks pass. Inputs / labels / hashes are NOT consent. The ONLY secret (E7_DEV_BOOKING_DATABASE_URL,
# environment `e7-readonly-probe`) is injected into the ONE last inspect step and nowhere else. No new secret, environment, permission or setting.
# Source digest = SHA-256 over: prefix "e7-hosted-notify-inspect-v1\n", then for each file IN THIS ORDER
#   1. scripts/e7-hosted-notify-inspect.mjs  2. test/e7-hosted-notify-inspect.test.mjs  3. test/e7-hosted-notify-inspect-workflow.test.mjs
#   4. .github/workflows/e7-hosted-notify-inspect.yml
# the frame  <relative path> NUL <decimal byte length> NUL <file bytes> NUL  (the framedDigest convention of the reviewed runners).
name: e7-hosted-notify-inspect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (default: no environment, no secrets, no database) or inspect (ONE read-only inspection; main only; needs a successful preflight of this dispatch)"
        type: choice
        options: [preflight, inspect]
        default: preflight
      approval_ref:
        description: "Approval label (non-secret; a label, never consent). Required for inspect."
        type: string
        required: false
        default: ""
      intent_id:
        description: "TEST intent UUID (v4) owning the guest.notify operation"
        type: string
        required: false
        default: ""
      op_id:
        description: "the guest.notify operation UUID"
        type: string
        required: false
        default: ""
      expected_version:
        description: "the intent's expected version (integer)"
        type: string
        required: false
        default: ""
      expected_plan_hash:
        description: "inspect only: exact 64-hex planHash printed by a REAL-plan preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""
      expected_source_digest:
        description: "inspect only: exact 64-hex source digest printed by a preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""
      expected_closure_digest:
        description: "inspect only: exact 64-hex closure digest of the pinned tooling (no default)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e7-hosted-notify-inspect
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit d322d219)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: d322d2192b377d18b6a9280ae06c17eddfe3e73e
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify checkout bindings (wrapper HEAD == dispatch SHA; tooling HEAD == pin; no secrets)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: d322d2192b377d18b6a9280ae06c17eddfe3e73e
          E7_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          case "$E7_MODE" in preflight|inspect) ;; *) echo "REFUSED: mode"; exit 3 ;; esac
          echo "bindings ok: wrapper=$head tooling=$tool mode=$E7_MODE"
      - name: Preflight (runner spawns the focused FAKE tests; plan hash + digests; no environment, no secret, no database, no dependency install)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
        run: node wrapper/scripts/e7-hosted-notify-inspect.mjs preflight
      - name: Source digest (deterministic framed SHA-256; documented order and prefix)
        env:
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
        run: |
          set -eu
          d="$({ printf 'e7-hosted-notify-inspect-v1\n'; for f in scripts/e7-hosted-notify-inspect.mjs test/e7-hosted-notify-inspect.test.mjs test/e7-hosted-notify-inspect-workflow.test.mjs .github/workflows/e7-hosted-notify-inspect.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          echo "sourceDigest=$d"
          if [ -n "$E7_EXPECTED_SOURCE_DIGEST" ] && [ "$E7_EXPECTED_SOURCE_DIGEST" != "$d" ]; then echo "REFUSED: expected_source_digest mismatch"; exit 3; fi

  inspect:
    needs: preflight
    if: inputs.mode == 'inspect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: e7-readonly-probe
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit d322d219)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: d322d2192b377d18b6a9280ae06c17eddfe3e73e
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Re-check bindings BEFORE any secret (HEAD == dispatch SHA; tooling pin; label; expected digests 64-hex; source digest)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: d322d2192b377d18b6a9280ae06c17eddfe3e73e
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ inputs.expected_closure_digest }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          [ -n "$E7_APPROVAL_REF" ] || { echo "REFUSED: approval_ref empty"; exit 3; }
          for v in "$E7_EXPECTED_PLAN_HASH" "$E7_EXPECTED_SOURCE_DIGEST" "$E7_EXPECTED_CLOSURE_DIGEST"; do printf '%s' "$v" | grep -Eq '^[0-9a-f]{64}$' || { echo "REFUSED: expected digest not 64-hex"; exit 3; }; done
          d="$({ printf 'e7-hosted-notify-inspect-v1\n'; for f in scripts/e7-hosted-notify-inspect.mjs test/e7-hosted-notify-inspect.test.mjs test/e7-hosted-notify-inspect-workflow.test.mjs .github/workflows/e7-hosted-notify-inspect.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$d" = "$E7_EXPECTED_SOURCE_DIGEST" ] || { echo "REFUSED: expected_source_digest mismatch (actual $d)"; exit 3; }
          echo "bindings ok: wrapper=$head tooling=$tool source=$d"
      - name: Verify (runner; closure / source / plan / approval bindings; no secret, no database)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node wrapper/scripts/e7-hosted-notify-inspect.mjs verify
      - name: Install the pinned dependency from the verified lockfile (no lifecycle scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the public Supabase CA (the runner checks its pinned SHA-256)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - name: ONE read-only notification admission inspection (the sole secret, this step only; READ ONLY transaction; ROLLBACK; no write path)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E7_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          E7_DEV_BOOKING_DATABASE_URL: ${{ secrets.E7_DEV_BOOKING_DATABASE_URL }}
        run: node wrapper/scripts/e7-hosted-notify-inspect.mjs inspect
