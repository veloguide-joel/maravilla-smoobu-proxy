# E7 C111: HOSTED KICKOFF runner (scripts/e7-hosted-kickoff.mjs): ONE bounded invocation of the ACCEPTED C108 kickoff consumer with the C110
# GitHub workflow_dispatch transport for ONE explicitly bound durable 0024 request (booking.pipeline_kickoff_requests) — it hands that request's
# stored inputs to e7-hosted-pipeline.yml on main and STOPS. Dispatch accepted (HTTP 204) is NOT a pipeline run result and NOT a booking.
# SHIPPED CLOSED: the runner's executeEnabled and dispatchEnabled are FALSE — `verify` (and therefore the execute job) refuses HKO_EXECUTE_CLOSED
# from key names only, before any value, import, credential, database or network; the secret step below is never reached while it is closed.
# HONEST LABEL: MANUAL workflow_dispatch only (no schedule / cron / webhook / repository_dispatch / route). The automatic consumer trigger is an
# explicit REMAINING GAP. Default mode `preflight` = no environment, no secret, no database, no dependency install (focused FAKE tests + digests).
# PERMISSIONS: workflow default `contents: read`. ONLY the gated execute job (main only, C119 S4 environment `e7-test-auto`) adds `actions: write`,
# and ONLY its final step receives the built-in, EPHEMERAL, job-scoped `github.token` (as E7_DISPATCH_TOKEN) — no PAT, no new secret, no App.
# The existing DB secret NAME E7_DEV_BOOKING_DATABASE_URL + the pinned Supabase CA appear in that SAME final step only.
# RELEASE BINDING: the transport's expectedMainSha is this run's own github.sha, used only after the SAME checkout's pipeline runnerFiles frame to
# the reviewed ENABLE source digest 5294b6b4…c3f5 (C119 S4; C116 880db5b3; was f09bcbbd…0999) (closure f7d7cad6…7273) — checked below in shell BEFORE any secret and again by the runner.
# C113 DETECT (MANUAL workflow_dispatch only; no schedule): mode `detect` = preflight → verify (CLOSED flags → CLOSED_NOOP exit 0, open=false:
# the gated jobs are SKIPPED, 0 DB-secret reads, 0 approval prompts) → `detect` (environment e7-test-auto (C119 S4) + fresh admission; the DB secret
# in its final step only; ONE rolled-back read-only snapshot; NO token, NO transport; declared outputs outcome + fingerprint only, never an
# identifier) → `execute` (APPROVAL #2, ONLY when detect output outcome == ONE; re-selects server-side and requires the same fingerprint).
# Manual `execute` stays reachable when `detect` is SKIPPED; a failed / cancelled preflight / verify / detect never reaches a secret job.
# C115 SCHEDULED DETECT (drafted CLOSED; activation is a separate ROOT decision): `schedule` cron '13,43 * * * *' = a NOMINAL 30-minute polling
# cadence, NOT a bounded worst-case delay (GitHub may delay or drop scheduled runs; they run only on the default branch). A scheduled run is ALWAYS
# the detect flow with EMPTY binding inputs (it cannot route to the manual execute path) and the SAME two approvals / concurrency group.
# C115 (superseded by C119 S2): its expected source digest came from the repository variable vars.E7_KICKOFF_EXPECTED_SOURCE; now it is the arm job's recomputed kickoff frame
# per ENABLE window); missing → the literal 'MISSING' → verify refuses (HKO_INPUT_INCOMPLETE / HKO_SOURCE_MISMATCH) BEFORE any approval,
# secret, SQL or HTTP — never a fallback to the computed digest. Manual workflow_dispatch and its expected_source_digest input are unchanged.
# On a CLOSED main a scheduled run is CLOSED_NOOP: detect + execute SKIPPED, 0 approvals, 0 DB secret, 0 SQL, 0 HTTP.
# HONEST LIMITS: wrapper HEAD == github.sha is a fixed-checkout proof, NOT a live-main proof; live main is checked only by the transport's
# GET main == releaseSha after the claim (with its documented notSent / TOCTOU limits). No mid-write cancellation, no reliance on run ordering;
# the durable single-winner claim stays the authority. Public-repo standard runners are currently free; ~96 job-minutes/day is a
# private-repo billing scenario only.
# C119 S2 TEST ARM (DRAFT, SHIPPED CLOSED; NO variable / environment / secret / setting is created or changed here): EVERY non-preflight route (schedule,
# manual verify / detect / execute — no manual bypass) first runs the `arm` job (no environment, no secret, no database): scripts/e7-test-arm.mjs recomputes
# the release digest from THIS checkout and compares it with vars.E7_TEST_AUTO_ARMED. Not armed (absent / malformed / stale / mismatched / not main) →
# armed=false → detect + execute are SKIPPED (0 approvals, 0 secrets, 0 SQL, 0 HTTP); verify (no environment) re-checks it with the runner's labelled copy
# (detect flow → CLOSED_NOOP). The scheduled source pin is the arm job's RECOMPUTED kickoff frame (replaces vars.E7_KICKOFF_EXPECTED_SOURCE). The arm
# now also gates e7-hosted-pipeline.yml (C119 S4: arm job + labelled gate + durable request binding). Cadence is TEST-only. C119 S4 P3: detect / execute
# re-check the LIVE main ref (built-in token) after any queue / approval delay, before any secret — revocation = a CLOSE commit moving main.
# WHEN GitHub refreshes the vars context for an already queued / approval-held job is UNVERIFIED: clearing the variable must NOT be relied on to revoke
# queued, pending-approval or running work (a pre-activation blocker).
# Source digest = SHA-256 over: prefix "e7-hosted-kickoff-v1\n", then for each file IN THIS ORDER
#   1. scripts/e7-hosted-kickoff.mjs  2. test/e7-hosted-kickoff.test.mjs  3. test/e7-hosted-kickoff-workflow.test.mjs  4. .github/workflows/e7-hosted-kickoff.yml
# the frame  <relative path> NUL <decimal byte length> NUL <file bytes> NUL  (the framedDigest convention of the reviewed runners).
name: e7-hosted-kickoff

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (default: no environment, no secrets, no database), verify (no secret), execute (manual bindings; SHIPPED CLOSED; main only; gate) or detect (C113: NO binding inputs; two gates)"
        type: choice
        options: [preflight, verify, execute, detect]
        default: preflight
      intent_id:
        description: "The ONE bound durable kickoff request's intent id (UUID); all five empty = SYNTHETIC preflight only."
        type: string
        required: false
        default: ""
      booking_ref:
        description: "That intent's booking ref (MV-…)."
        type: string
        required: false
        default: ""
      expected_version:
        description: "The request's exact authorized_version (= the intent's current version)."
        type: string
        required: false
        default: ""
      payment_intent_id:
        description: "The request's bound TEST PaymentIntent id (pi_…)."
        type: string
        required: false
        default: ""
      amount_minor:
        description: "The request's EXACT amount in minor units (USD)."
        type: string
        required: false
        default: ""
      expected_source_digest:
        description: "verify / execute only: exact 64-hex kickoff source digest printed by a preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e7-hosted-kickoff
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout E7 kickoff tooling (fixed commit 3a3cc449)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify checkout bindings (wrapper HEAD == dispatch SHA; tooling HEAD == pin; no secrets)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          E7_MODE: ${{ github.event_name == 'schedule' && 'detect' || inputs.mode }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          case "$E7_MODE" in preflight|verify|execute|detect) ;; *) echo "REFUSED: mode"; exit 3 ;; esac
          echo "bindings ok: wrapper=$head tooling=$tool mode=$E7_MODE"
      - name: Preflight (runner spawns the focused FAKE tests; digests; no environment, no secret, no database, no dependency install)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_BOOKING_REF: ${{ inputs.booking_ref }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_PAYMENT_INTENT_ID: ${{ inputs.payment_intent_id }}
          E7_AMOUNT_MINOR: ${{ inputs.amount_minor }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
        run: node wrapper/scripts/e7-hosted-kickoff.mjs preflight

  arm:
    needs: preflight
    if: github.event_name == 'schedule' || inputs.mode == 'verify' || inputs.mode == 'execute' || inputs.mode == 'detect'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
      kickoff: ${{ steps.arm.outputs.kickoff }}
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: TEST arm gate (release digest recomputed from this checkout; no environment, no secret, no database; not armed → CLOSED_NOOP)
        id: arm
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
        run: node wrapper/scripts/e7-test-arm.mjs check

  verify:
    needs: [preflight, arm]
    if: inputs.mode == 'verify' || inputs.mode == 'execute' || inputs.mode == 'detect' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      open: ${{ steps.verify.outputs.open }}
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout E7 kickoff tooling (fixed commit 3a3cc449)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify (runner; SHIPPED CLOSED → HKO_EXECUTE_CLOSED here, or CLOSED_NOOP for detect; no secret, no database, no environment)
        id: verify
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_INPUT_MODE: ${{ github.event_name == 'schedule' && 'detect' || inputs.mode }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_BOOKING_REF: ${{ inputs.booking_ref }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_PAYMENT_INTENT_ID: ${{ inputs.payment_intent_id }}
          E7_AMOUNT_MINOR: ${{ inputs.amount_minor }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && (needs.arm.outputs.kickoff || 'MISSING') || inputs.expected_source_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node wrapper/scripts/e7-hosted-kickoff.mjs verify

  detect:
    needs: [preflight, arm, verify]
    if: (inputs.mode == 'detect' || github.event_name == 'schedule') && needs.arm.outputs.armed == 'true' && needs.verify.outputs.open == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: e7-test-auto
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.detect.outputs.outcome }}
      fingerprint: ${{ steps.detect.outputs.fingerprint }}
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout E7 kickoff tooling (fixed commit 3a3cc449)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Re-check bindings BEFORE the DB secret, detect (HEAD == dispatch SHA; tooling pin; kickoff source digest; pipeline release binding 5294b6b4)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && (needs.arm.outputs.kickoff || 'MISSING') || inputs.expected_source_digest }}
          E7_PIPELINE_SOURCE_PIN: 5294b6b467839e1dd825e56063abc1ad1267eafdfb2973f2c2129e9b1f29c3f5
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          printf '%s' "$E7_EXPECTED_SOURCE_DIGEST" | grep -Eq '^[0-9a-f]{64}$' || { echo "REFUSED: expected_source_digest not 64-hex"; exit 3; }
          d="$({ printf 'e7-hosted-kickoff-v1\n'; for f in scripts/e7-hosted-kickoff.mjs test/e7-hosted-kickoff.test.mjs test/e7-hosted-kickoff-workflow.test.mjs .github/workflows/e7-hosted-kickoff.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$d" = "$E7_EXPECTED_SOURCE_DIGEST" ] || { echo "REFUSED: expected_source_digest mismatch (actual $d)"; exit 3; }
          p="$({ printf 'e7-hosted-pipeline-v1\n'; for f in scripts/e7-hosted-pipeline.mjs test/e7-hosted-pipeline.test.mjs test/e7-hosted-pipeline-workflow.test.mjs .github/workflows/e7-hosted-pipeline.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$p" = "$E7_PIPELINE_SOURCE_PIN" ] || { echo "REFUSED: pipeline at this commit is not the reviewed ENABLE source (actual $p)"; exit 3; }
          echo "bindings ok: wrapper=$head tooling=$tool source=$d pipeline=$p"
      - name: Fresh admission (C119 S4 P3; live main ref == this run's commit, checked AFTER any queue / approval delay; built-in token only; BEFORE verify / any secret)
        env:
          FRESH_SHA: ${{ github.sha }}
          FRESH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$FRESH_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "REFUSED: MAIN_UNREADABLE (sha)"; exit 3; }
          [ -n "$FRESH_TOKEN" ] || { echo "REFUSED: MAIN_UNREADABLE (token)"; exit 3; }
          body="$(printf 'Authorization: Bearer %s\n' "$FRESH_TOKEN" | curl --silent --show-error --fail --proto '=https' --max-redirs 0 --max-time 15 --max-filesize 8192 -H @- -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/veloguide-joel/maravilla-smoobu-proxy/git/ref/heads/main)" || { echo "REFUSED: MAIN_UNREADABLE (http)"; exit 3; }
          live="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d;if(s.length>8192)process.exit(3);}).on("end",()=>{let j;try{j=JSON.parse(s);}catch{process.exit(3);}const o=j&&j.object;if(!j||j.ref!=="refs/heads/main"||!o||o.type!=="commit"||typeof o.sha!=="string"||!/^[0-9a-f]{40}$/.test(o.sha))process.exit(3);process.stdout.write(o.sha);});')" || { echo "REFUSED: MAIN_UNREADABLE (shape)"; exit 3; }
          [ "$live" = "$FRESH_SHA" ] || { echo "REFUSED: MAIN_MOVED (live main != this run's commit; a CLOSE commit revokes not-yet-admitted work)"; exit 3; }
          echo "fresh admission ok: live main == this run's commit (point-in-time; a later move of main is not seen by this run)"
      - name: Install the pinned dependency from the verified lockfile (no lifecycle scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the public Supabase CA (the runner checks its pinned SHA-256)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - name: ONE gated read-only detection (the DB secret only, this step only; one rolled-back snapshot; no token, no dispatch)
        id: detect
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_INPUT_MODE: ${{ github.event_name == 'schedule' && 'detect' || inputs.mode }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && (needs.arm.outputs.kickoff || 'MISSING') || inputs.expected_source_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E7_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          E7_DEV_BOOKING_DATABASE_URL: ${{ secrets.E7_DEV_BOOKING_DATABASE_URL }}
        run: node wrapper/scripts/e7-hosted-kickoff.mjs detect

  execute:
    needs: [preflight, arm, verify, detect]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.preflight.result == 'success' && needs.arm.result == 'success' && needs.arm.outputs.armed == 'true' && needs.verify.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' && needs.detect.result == 'skipped') || ((inputs.mode == 'detect' || github.event_name == 'schedule') && needs.detect.result == 'success' && needs.detect.outputs.outcome == 'ONE')) }}
    runs-on: ubuntu-24.04
    environment: e7-test-auto
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout E7 kickoff tooling (fixed commit 3a3cc449)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Re-check bindings BEFORE any secret (HEAD == dispatch SHA; tooling pin; kickoff source digest; pipeline release binding 5294b6b4)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 3a3cc44942bc149c037acaa5d9afa14bf3ed57d9
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && (needs.arm.outputs.kickoff || 'MISSING') || inputs.expected_source_digest }}
          E7_PIPELINE_SOURCE_PIN: 5294b6b467839e1dd825e56063abc1ad1267eafdfb2973f2c2129e9b1f29c3f5
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          printf '%s' "$E7_EXPECTED_SOURCE_DIGEST" | grep -Eq '^[0-9a-f]{64}$' || { echo "REFUSED: expected_source_digest not 64-hex"; exit 3; }
          d="$({ printf 'e7-hosted-kickoff-v1\n'; for f in scripts/e7-hosted-kickoff.mjs test/e7-hosted-kickoff.test.mjs test/e7-hosted-kickoff-workflow.test.mjs .github/workflows/e7-hosted-kickoff.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$d" = "$E7_EXPECTED_SOURCE_DIGEST" ] || { echo "REFUSED: expected_source_digest mismatch (actual $d)"; exit 3; }
          p="$({ printf 'e7-hosted-pipeline-v1\n'; for f in scripts/e7-hosted-pipeline.mjs test/e7-hosted-pipeline.test.mjs test/e7-hosted-pipeline-workflow.test.mjs .github/workflows/e7-hosted-pipeline.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$p" = "$E7_PIPELINE_SOURCE_PIN" ] || { echo "REFUSED: pipeline at this commit is not the reviewed ENABLE source (actual $p)"; exit 3; }
          echo "bindings ok: wrapper=$head tooling=$tool source=$d pipeline=$p"
      - name: Fresh admission (C119 S4 P3; live main ref == this run's commit, checked AFTER any queue / approval delay; built-in token only; BEFORE verify / any secret)
        env:
          FRESH_SHA: ${{ github.sha }}
          FRESH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$FRESH_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "REFUSED: MAIN_UNREADABLE (sha)"; exit 3; }
          [ -n "$FRESH_TOKEN" ] || { echo "REFUSED: MAIN_UNREADABLE (token)"; exit 3; }
          body="$(printf 'Authorization: Bearer %s\n' "$FRESH_TOKEN" | curl --silent --show-error --fail --proto '=https' --max-redirs 0 --max-time 15 --max-filesize 8192 -H @- -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/veloguide-joel/maravilla-smoobu-proxy/git/ref/heads/main)" || { echo "REFUSED: MAIN_UNREADABLE (http)"; exit 3; }
          live="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d;if(s.length>8192)process.exit(3);}).on("end",()=>{let j;try{j=JSON.parse(s);}catch{process.exit(3);}const o=j&&j.object;if(!j||j.ref!=="refs/heads/main"||!o||o.type!=="commit"||typeof o.sha!=="string"||!/^[0-9a-f]{40}$/.test(o.sha))process.exit(3);process.stdout.write(o.sha);});')" || { echo "REFUSED: MAIN_UNREADABLE (shape)"; exit 3; }
          [ "$live" = "$FRESH_SHA" ] || { echo "REFUSED: MAIN_MOVED (live main != this run's commit; a CLOSE commit revokes not-yet-admitted work)"; exit 3; }
          echo "fresh admission ok: live main == this run's commit (point-in-time; a later move of main is not seen by this run)"
      - name: Install the pinned dependency from the verified lockfile (no lifecycle scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the public Supabase CA (the runner checks its pinned SHA-256)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - name: ONE gated kickoff handoff (the only secrets + the job-scoped token, this step only; <= 1 GET + 1 POST; no retry)
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_BOOKING_REF: ${{ inputs.booking_ref }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_PAYMENT_INTENT_ID: ${{ inputs.payment_intent_id }}
          E7_AMOUNT_MINOR: ${{ inputs.amount_minor }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && (needs.arm.outputs.kickoff || 'MISSING') || inputs.expected_source_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E7_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          E7_INPUT_MODE: ${{ github.event_name == 'schedule' && 'detect' || inputs.mode }}
          E7_EXPECTED_CANDIDATE_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          E7_DEV_BOOKING_DATABASE_URL: ${{ secrets.E7_DEV_BOOKING_DATABASE_URL }}
          E7_DISPATCH_TOKEN: ${{ github.token }}
        run: node wrapper/scripts/e7-hosted-kickoff.mjs execute
