# E7 C50: HOSTED gn-v2 BOOKING-CONFIRMATION runner for ONE bound TEST guest.notify operation (scripts/e7-hosted-booking-confirmation.mjs) around the
# ACCEPTED notification worker + gn-v2 builder + branded Resend executor / exchange (tooling 66133a22 = C116 #180 merge, tree ade3e084) and the schema-23 receipts on the reviewed schema 27 (C119 S1; was 26).
# SHIPPED CLOSED: the runner's executeEnabled is FALSE — `verify` (and therefore the execute job) refuses NBC_EXECUTE_CLOSED before any import,
# credential, database or provider access; the secret steps below are never reached while it is closed. HONEST LABEL: MANUAL hosted TEST runner
# (workflow_dispatch + the EXISTING `e7-readonly-probe` reviewer gate); NOT automatic, NOT a queue / cron / API path; ONE bound op, ONE worker
# invocation, ONE send at most, no retry. The sender is the fixed synthetic `.invalid` identity (not a usable live Resend identity); the recipient
# comes only from the database through the accepted `.invalid` fences. Provider acceptance is NOT delivery. Refunds stay manual; five flags CLOSED.
# Default mode `preflight` = no environment, no secret, no database: focused FAKE tests (spawned by the runner) + the plan hash + the digests.
# The ONLY secrets (existing NAMES E7_DEV_BOOKING_DATABASE_URL and E7_RESEND_TEST_KEY, environment `e7-readonly-probe`) appear in the ONE last
# execute step only. No new secret, environment, permission or setting.
# C119 S1 DETECT (DRAFT, SHIPPED CLOSED; MANUAL workflow_dispatch only — no schedule, no repository variable, no new environment / secret / setting):
# mode `detect` = preflight → `detect` (environment e7-readonly-probe = APPROVAL #1; the runner's own verify FIRST — SHIPPED CLOSED refuses
# NBC_EXECUTE_CLOSED there, before the DB secret step; then ONLY the DB secret in the LAST step; read-only snapshots; declared outputs outcome +
# fingerprint only, never an identifier; no Resend key) → `execute` (APPROVAL #2, ONLY when detect outcome == ONE; no hand-bound identifier: the
# runner re-selects server-side and requires the SAME fingerprint, then the unchanged admission + ONE accepted worker invocation). The manual
# bound-op execute path is unchanged and reachable only when detect is SKIPPED. >1 eligible → STOP (a capacity limitation of this TEST slice).
# C119 S2 TEST ARM + DRAFT SCHEDULE (SHIPPED CLOSED; executeEnabled stays FALSE; NO variable / environment / secret / setting is created or changed here):
# `schedule` cron '28,58 * * * *' = a NOMINAL 30-minute TEST-only polling cadence (NOT a launch SLA; GitHub may delay / drop scheduled runs). A scheduled
# run is ALWAYS the detect flow with EMPTY bindings. EVERY non-preflight route (schedule, manual detect, manual execute — no manual bypass) first runs
# the `arm` job (no environment, no secret, no database): scripts/e7-test-arm.mjs recomputes the release digest from THIS checkout and compares it with
# vars.E7_TEST_AUTO_ARMED; absent / malformed / stale / mismatched / not main → armed=false → CLOSED_NOOP: every environment job is SKIPPED (0 approval
# prompts, 0 secrets, 0 SQL, 0 HTTP). The runner re-checks the value it RECEIVES (labelled copy) inside each gated job BEFORE any secret step. WHEN GitHub
# refreshes the vars context for an already queued / approval-held job is UNVERIFIED: clearing the variable must NOT be relied on to revoke queued,
# pending-approval or running work (a pre-activation blocker).
# Source digest = SHA-256 over: prefix "e7-hosted-booking-confirmation-v1\n", then for each file IN THIS ORDER
#   1. scripts/e7-hosted-booking-confirmation.mjs  2. test/e7-hosted-booking-confirmation.test.mjs  3. test/e7-hosted-booking-confirmation-workflow.test.mjs
#   4. .github/workflows/e7-hosted-booking-confirmation.yml
# the frame  <relative path> NUL <decimal byte length> NUL <file bytes> NUL  (the framedDigest convention of the reviewed runners).
name: e7-hosted-booking-confirmation

on:
  schedule:
    - cron: '28,58 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (default: no environment, no secrets, no database), detect (C119 S1: read-only server-side selection of ONE eligible op, then execute only on ONE) or execute (manual bound op). SHIPPED CLOSED: detect / execute refuse at verify; main only"
        type: choice
        options: [preflight, detect, execute]
        default: preflight
      approval_ref:
        description: "Approval label (non-secret; a label, never consent). Required for execute."
        type: string
        required: false
        default: ""
      intent_id:
        description: "TEST intent UUID (v4) owning the guest.notify operation"
        type: string
        required: false
        default: ""
      op_id:
        description: "the guest.notify operation UUID"
        type: string
        required: false
        default: ""
      expected_version:
        description: "the intent's expected version (integer)"
        type: string
        required: false
        default: ""
      locale:
        description: "gn-v2 confirmation locale: en or es (never guessed)"
        type: string
        required: false
        default: ""
      expected_plan_hash:
        description: "execute only: exact 64-hex planHash printed by a REAL-plan preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""
      expected_source_digest:
        description: "execute only: exact 64-hex source digest printed by a preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""
      expected_closure_digest:
        description: "execute only: exact 64-hex closure digest of the pinned tooling (no default)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e7-hosted-booking-confirmation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit 66133a22)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 66133a22edca925e6386c4d178c251fa5f11c82e
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify checkout bindings (wrapper HEAD == dispatch SHA; tooling HEAD == pin; no secrets)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 66133a22edca925e6386c4d178c251fa5f11c82e
          E7_MODE: ${{ github.event_name == 'schedule' && 'detect' || inputs.mode }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          case "$E7_MODE" in preflight|detect|execute) ;; *) echo "REFUSED: mode"; exit 3 ;; esac
          echo "bindings ok: wrapper=$head tooling=$tool mode=$E7_MODE"
      - name: Preflight (runner spawns the focused FAKE tests; plan hash + digests; no environment, no secret, no database, no dependency install)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_LOCALE: ${{ inputs.locale }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs preflight
      - name: Source digest (deterministic framed SHA-256; documented order and prefix)
        env:
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
        run: |
          set -eu
          d="$({ printf 'e7-hosted-booking-confirmation-v1\n'; for f in scripts/e7-hosted-booking-confirmation.mjs test/e7-hosted-booking-confirmation.test.mjs test/e7-hosted-booking-confirmation-workflow.test.mjs .github/workflows/e7-hosted-booking-confirmation.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          echo "sourceDigest=$d"
          if [ -n "$E7_EXPECTED_SOURCE_DIGEST" ] && [ "$E7_EXPECTED_SOURCE_DIGEST" != "$d" ]; then echo "REFUSED: expected_source_digest mismatch"; exit 3; fi

  arm:
    needs: preflight
    if: github.event_name == 'schedule' || inputs.mode == 'detect' || inputs.mode == 'execute'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
      confirmation: ${{ steps.arm.outputs.confirmation }}
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: TEST arm gate (release digest recomputed from this checkout; no environment, no secret, no database; not armed → CLOSED_NOOP)
        id: arm
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
        run: node wrapper/scripts/e7-test-arm.mjs check

  detect:
    needs: [preflight, arm]
    if: (inputs.mode == 'detect' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && needs.arm.outputs.armed == 'true'
    runs-on: ubuntu-24.04
    environment: e7-readonly-probe
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.detect.outputs.outcome }}
      fingerprint: ${{ steps.detect.outputs.fingerprint }}
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit 66133a22)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 66133a22edca925e6386c4d178c251fa5f11c82e
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Re-check bindings BEFORE the DB secret, detect (HEAD == dispatch SHA; tooling pin; no binding input; expected digests 64-hex; source digest)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 66133a22edca925e6386c4d178c251fa5f11c82e
          E7_BINDINGS: ${{ inputs.approval_ref }}${{ inputs.intent_id }}${{ inputs.op_id }}${{ inputs.expected_version }}${{ inputs.locale }}${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && needs.arm.outputs.confirmation || inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ github.event_name == 'schedule' && '6f02ce24f92dc0ef4a4d4bbe22adc4203f15f7ec64f36909dd0b1a8d2bd55d06' || inputs.expected_closure_digest }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          [ -z "$E7_BINDINGS" ] || { echo "REFUSED: detect takes no binding input"; exit 3; }
          for v in "$E7_EXPECTED_SOURCE_DIGEST" "$E7_EXPECTED_CLOSURE_DIGEST"; do printf '%s' "$v" | grep -Eq '^[0-9a-f]{64}$' || { echo "REFUSED: expected digest not 64-hex"; exit 3; }; done
          d="$({ printf 'e7-hosted-booking-confirmation-v1\n'; for f in scripts/e7-hosted-booking-confirmation.mjs test/e7-hosted-booking-confirmation.test.mjs test/e7-hosted-booking-confirmation-workflow.test.mjs .github/workflows/e7-hosted-booking-confirmation.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$d" = "$E7_EXPECTED_SOURCE_DIGEST" ] || { echo "REFUSED: expected_source_digest mismatch (actual $d)"; exit 3; }
          echo "bindings ok: wrapper=$head tooling=$tool source=$d"
      - name: Verify, detect flow (runner; SHIPPED CLOSED → NBC_EXECUTE_CLOSED here; no secret, no database)
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_INPUT_MODE: detect
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && needs.arm.outputs.confirmation || inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ github.event_name == 'schedule' && '6f02ce24f92dc0ef4a4d4bbe22adc4203f15f7ec64f36909dd0b1a8d2bd55d06' || inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs verify
      - name: Install the pinned dependency from the verified lockfile (no lifecycle scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the public Supabase CA (the runner checks its pinned SHA-256)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - name: ONE read-only detection (the DB secret only, this step only; writes nothing; outputs outcome + fingerprint only)
        id: detect
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && needs.arm.outputs.confirmation || inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ github.event_name == 'schedule' && '6f02ce24f92dc0ef4a4d4bbe22adc4203f15f7ec64f36909dd0b1a8d2bd55d06' || inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E7_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          E7_DEV_BOOKING_DATABASE_URL: ${{ secrets.E7_DEV_BOOKING_DATABASE_URL }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs detect

  execute:
    needs: [preflight, arm, detect]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.preflight.result == 'success' && needs.arm.result == 'success' && needs.arm.outputs.armed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' && needs.detect.result == 'skipped') || ((inputs.mode == 'detect' || github.event_name == 'schedule') && needs.detect.result == 'success' && needs.detect.outputs.outcome == 'ONE')) }}
    runs-on: ubuntu-24.04
    environment: e7-readonly-probe
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit 66133a22)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 66133a22edca925e6386c4d178c251fa5f11c82e
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Re-check bindings BEFORE any secret (HEAD == dispatch SHA; tooling pin; flow bindings; expected digests 64-hex; source digest)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 66133a22edca925e6386c4d178c251fa5f11c82e
          E7_INPUT_MODE: ${{ (inputs.mode == 'detect' || github.event_name == 'schedule') && 'detect' || 'manual' }}
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_CANDIDATE_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && needs.arm.outputs.confirmation || inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ github.event_name == 'schedule' && '6f02ce24f92dc0ef4a4d4bbe22adc4203f15f7ec64f36909dd0b1a8d2bd55d06' || inputs.expected_closure_digest }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          case "$E7_INPUT_MODE" in
            manual) [ -n "$E7_APPROVAL_REF" ] || { echo "REFUSED: approval_ref empty"; exit 3; }; [ -z "$E7_EXPECTED_CANDIDATE_FINGERPRINT" ] || { echo "REFUSED: fingerprint in a manual flow"; exit 3; }; fp="$E7_EXPECTED_PLAN_HASH" ;;
            detect) [ -z "$E7_APPROVAL_REF$E7_EXPECTED_PLAN_HASH" ] || { echo "REFUSED: detect flow takes no label / plan hash"; exit 3; }; fp="$E7_EXPECTED_CANDIDATE_FINGERPRINT" ;;
            *) echo "REFUSED: flow"; exit 3 ;;
          esac
          for v in "$fp" "$E7_EXPECTED_SOURCE_DIGEST" "$E7_EXPECTED_CLOSURE_DIGEST"; do printf '%s' "$v" | grep -Eq '^[0-9a-f]{64}$' || { echo "REFUSED: expected digest not 64-hex"; exit 3; }; done
          d="$({ printf 'e7-hosted-booking-confirmation-v1\n'; for f in scripts/e7-hosted-booking-confirmation.mjs test/e7-hosted-booking-confirmation.test.mjs test/e7-hosted-booking-confirmation-workflow.test.mjs .github/workflows/e7-hosted-booking-confirmation.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$d" = "$E7_EXPECTED_SOURCE_DIGEST" ] || { echo "REFUSED: expected_source_digest mismatch (actual $d)"; exit 3; }
          echo "bindings ok: wrapper=$head tooling=$tool source=$d"
      - name: Verify (runner; SHIPPED CLOSED → NBC_EXECUTE_CLOSED here; else closure / source / plan / approval bindings; no secret, no database)
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_INPUT_MODE: ${{ (inputs.mode == 'detect' || github.event_name == 'schedule') && 'detect' || 'manual' }}
          E7_EXPECTED_CANDIDATE_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_LOCALE: ${{ inputs.locale }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && needs.arm.outputs.confirmation || inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ github.event_name == 'schedule' && '6f02ce24f92dc0ef4a4d4bbe22adc4203f15f7ec64f36909dd0b1a8d2bd55d06' || inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs verify
      - name: Install the pinned dependency from the verified lockfile (no lifecycle scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the public Supabase CA (the runner checks its pinned SHA-256)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - name: ONE bound gn-v2 booking confirmation (the only secrets, this step only; ONE worker invocation, at most ONE send, no retry)
        env:
          E7_TEST_ARM: ${{ vars.E7_TEST_AUTO_ARMED }}
          E7_INPUT_MODE: ${{ (inputs.mode == 'detect' || github.event_name == 'schedule') && 'detect' || 'manual' }}
          E7_EXPECTED_CANDIDATE_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_LOCALE: ${{ inputs.locale }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ github.event_name == 'schedule' && needs.arm.outputs.confirmation || inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ github.event_name == 'schedule' && '6f02ce24f92dc0ef4a4d4bbe22adc4203f15f7ec64f36909dd0b1a8d2bd55d06' || inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E7_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          E7_DEV_BOOKING_DATABASE_URL: ${{ secrets.E7_DEV_BOOKING_DATABASE_URL }}
          E7_RESEND_TEST_KEY: ${{ secrets.E7_RESEND_TEST_KEY }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs execute
