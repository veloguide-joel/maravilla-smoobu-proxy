# E7 C50: HOSTED gn-v2 BOOKING-CONFIRMATION runner for ONE bound TEST guest.notify operation (scripts/e7-hosted-booking-confirmation.mjs) around the
# ACCEPTED notification worker + gn-v2 builder + branded Resend executor / exchange (tooling 9b7a96bf = C116 #178 merge, tree 40dbe13f) and the schema-23 receipts on the reviewed schema 25.
# SHIPPED CLOSED: the runner's executeEnabled is FALSE — `verify` (and therefore the execute job) refuses NBC_EXECUTE_CLOSED before any import,
# credential, database or provider access; the secret steps below are never reached while it is closed. HONEST LABEL: MANUAL hosted TEST runner
# (workflow_dispatch + the EXISTING `e7-readonly-probe` reviewer gate); NOT automatic, NOT a queue / cron / API path; ONE bound op, ONE worker
# invocation, ONE send at most, no retry. The sender is the fixed synthetic `.invalid` identity (not a usable live Resend identity); the recipient
# comes only from the database through the accepted `.invalid` fences. Provider acceptance is NOT delivery. Refunds stay manual; five flags CLOSED.
# Default mode `preflight` = no environment, no secret, no database: focused FAKE tests (spawned by the runner) + the plan hash + the digests.
# The ONLY secrets (existing NAMES E7_DEV_BOOKING_DATABASE_URL and E7_RESEND_TEST_KEY, environment `e7-readonly-probe`) appear in the ONE last
# execute step only. No new secret, environment, permission or setting.
# Source digest = SHA-256 over: prefix "e7-hosted-booking-confirmation-v1\n", then for each file IN THIS ORDER
#   1. scripts/e7-hosted-booking-confirmation.mjs  2. test/e7-hosted-booking-confirmation.test.mjs  3. test/e7-hosted-booking-confirmation-workflow.test.mjs
#   4. .github/workflows/e7-hosted-booking-confirmation.yml
# the frame  <relative path> NUL <decimal byte length> NUL <file bytes> NUL  (the framedDigest convention of the reviewed runners).
name: e7-hosted-booking-confirmation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (default: no environment, no secrets, no database) or execute (SHIPPED CLOSED: refuses at verify; main only; needs a successful preflight of this dispatch)"
        type: choice
        options: [preflight, execute]
        default: preflight
      approval_ref:
        description: "Approval label (non-secret; a label, never consent). Required for execute."
        type: string
        required: false
        default: ""
      intent_id:
        description: "TEST intent UUID (v4) owning the guest.notify operation"
        type: string
        required: false
        default: ""
      op_id:
        description: "the guest.notify operation UUID"
        type: string
        required: false
        default: ""
      expected_version:
        description: "the intent's expected version (integer)"
        type: string
        required: false
        default: ""
      locale:
        description: "gn-v2 confirmation locale: en or es (never guessed)"
        type: string
        required: false
        default: ""
      expected_plan_hash:
        description: "execute only: exact 64-hex planHash printed by a REAL-plan preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""
      expected_source_digest:
        description: "execute only: exact 64-hex source digest printed by a preflight of this SAME commit (no default)"
        type: string
        required: false
        default: ""
      expected_closure_digest:
        description: "execute only: exact 64-hex closure digest of the pinned tooling (no default)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e7-hosted-booking-confirmation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit 9b7a96bf)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 9b7a96bfe9dcc702b8389129cf4191032e716aaf
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify checkout bindings (wrapper HEAD == dispatch SHA; tooling HEAD == pin; no secrets)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 9b7a96bfe9dcc702b8389129cf4191032e716aaf
          E7_MODE: ${{ inputs.mode }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          case "$E7_MODE" in preflight|execute) ;; *) echo "REFUSED: mode"; exit 3 ;; esac
          echo "bindings ok: wrapper=$head tooling=$tool mode=$E7_MODE"
      - name: Preflight (runner spawns the focused FAKE tests; plan hash + digests; no environment, no secret, no database, no dependency install)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_LOCALE: ${{ inputs.locale }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs preflight
      - name: Source digest (deterministic framed SHA-256; documented order and prefix)
        env:
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
        run: |
          set -eu
          d="$({ printf 'e7-hosted-booking-confirmation-v1\n'; for f in scripts/e7-hosted-booking-confirmation.mjs test/e7-hosted-booking-confirmation.test.mjs test/e7-hosted-booking-confirmation-workflow.test.mjs .github/workflows/e7-hosted-booking-confirmation.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          echo "sourceDigest=$d"
          if [ -n "$E7_EXPECTED_SOURCE_DIGEST" ] && [ "$E7_EXPECTED_SOURCE_DIGEST" != "$d" ]; then echo "REFUSED: expected_source_digest mismatch"; exit 3; fi

  execute:
    needs: preflight
    if: inputs.mode == 'execute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: e7-readonly-probe
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (this repository, exact dispatched commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: wrapper
          persist-credentials: false
      - name: Checkout merged E7 tooling (fixed commit 9b7a96bf)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: veloguide-joel/maravilla-smoobu-proxy
          ref: 9b7a96bfe9dcc702b8389129cf4191032e716aaf
          path: tooling
          persist-credentials: false
      - name: Set up Node 22.22.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Re-check bindings BEFORE any secret (HEAD == dispatch SHA; tooling pin; label; expected digests 64-hex; source digest)
        env:
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_TOOLING_PIN: 9b7a96bfe9dcc702b8389129cf4191032e716aaf
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ inputs.expected_closure_digest }}
        run: |
          set -eu
          head="$(git -C wrapper rev-parse HEAD)"
          [ "$head" = "$E7_WORKFLOW_SHA" ] || { echo "REFUSED: wrapper HEAD != dispatch SHA"; exit 3; }
          tool="$(git -C tooling rev-parse HEAD)"
          [ "$tool" = "$E7_TOOLING_PIN" ] || { echo "REFUSED: tooling HEAD != pin"; exit 3; }
          [ -n "$E7_APPROVAL_REF" ] || { echo "REFUSED: approval_ref empty"; exit 3; }
          for v in "$E7_EXPECTED_PLAN_HASH" "$E7_EXPECTED_SOURCE_DIGEST" "$E7_EXPECTED_CLOSURE_DIGEST"; do printf '%s' "$v" | grep -Eq '^[0-9a-f]{64}$' || { echo "REFUSED: expected digest not 64-hex"; exit 3; }; done
          d="$({ printf 'e7-hosted-booking-confirmation-v1\n'; for f in scripts/e7-hosted-booking-confirmation.mjs test/e7-hosted-booking-confirmation.test.mjs test/e7-hosted-booking-confirmation-workflow.test.mjs .github/workflows/e7-hosted-booking-confirmation.yml; do printf '%s\0%s\0' "$f" "$(stat -c%s "wrapper/$f")"; cat "wrapper/$f"; printf '\0'; done; } | sha256sum | cut -d' ' -f1)"
          [ "$d" = "$E7_EXPECTED_SOURCE_DIGEST" ] || { echo "REFUSED: expected_source_digest mismatch (actual $d)"; exit 3; }
          echo "bindings ok: wrapper=$head tooling=$tool source=$d"
      - name: Verify (runner; SHIPPED CLOSED → NBC_EXECUTE_CLOSED here; else closure / source / plan / approval bindings; no secret, no database)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_LOCALE: ${{ inputs.locale }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs verify
      - name: Install the pinned dependency from the verified lockfile (no lifecycle scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the public Supabase CA (the runner checks its pinned SHA-256)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      - name: ONE bound gn-v2 booking confirmation (the only secrets, this step only; ONE worker invocation, at most ONE send, no retry)
        env:
          E7_TOOLING_DIR: ${{ github.workspace }}/tooling
          E7_APPROVAL_REF: ${{ inputs.approval_ref }}
          E7_INTENT_ID: ${{ inputs.intent_id }}
          E7_OP_ID: ${{ inputs.op_id }}
          E7_EXPECTED_VERSION: ${{ inputs.expected_version }}
          E7_LOCALE: ${{ inputs.locale }}
          E7_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          E7_EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
          E7_EXPECTED_CLOSURE_DIGEST: ${{ inputs.expected_closure_digest }}
          E7_WORKFLOW_SHA: ${{ github.sha }}
          E7_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E7_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          E7_DEV_BOOKING_DATABASE_URL: ${{ secrets.E7_DEV_BOOKING_DATABASE_URL }}
          E7_RESEND_TEST_KEY: ${{ secrets.E7_RESEND_TEST_KEY }}
        run: node wrapper/scripts/e7-hosted-booking-confirmation.mjs execute
