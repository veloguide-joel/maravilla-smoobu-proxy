# mv-pipeline: the mode-aware booking pipeline runner (scripts/mv-pipeline.mjs). Design: PRODUCTION.md, "P2c design".
#
# Manual dispatch only, no schedule. This copy on main only makes the workflow dispatchable (PRODUCTION.md on e7-test, "P5 plan", step A):
# the code that runs is the commit given in `ref` (the e7-test head), not main. It is not part of any arm manifest and touches none
# of the old TEST runner files.
#
# One run: every paid booking on an approved listing is taken through reserve -> capture -> record by the existing workers
# (their claims, proofs, fences and 1 / 1 / 1 write budgets are the authority). Output: ONE JSON line of codes and counts.
# Exit 1 means a person must look (GitHub emails the owner).
name: mv-pipeline
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test (TEST database, Stripe TEST) or live"
        required: true
        type: choice
        options: [test, live]
      ref:
        description: "full 40-hex commit of e7-test to run"
        required: true
        type: string
      action:
        description: "run (process bookings) or status (read-only look; writes nothing, calls no provider)"
        required: false
        default: run
        type: choice
        options: [run, status]
permissions:
  contents: read
concurrency:
  group: mv-pipeline-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.mode == 'live' && 'mv-live' || 'e7-test-auto' }}
    steps:
      - name: The ref must be a full commit id
        env:
          MV_REF: ${{ inputs.ref }}
        run: |
          [[ "$MV_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be 40 lowercase hex"; exit 1; }
      # Live runs only the one commit the owner approved (repo variable MV_LIVE_APPROVED_REF), and only when dispatched from main.
      # Fail closed: an empty or malformed variable, another commit, or another branch stops the job before any code is checked out
      # and before any secret is read (secrets appear only in the last step).
      - name: Live runs only the approved commit, from main
        if: inputs.mode == 'live'
        env:
          MV_REF: ${{ inputs.ref }}
          MV_APPROVED: ${{ vars.MV_LIVE_APPROVED_REF }}
          MV_DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$MV_DISPATCH_REF" == "refs/heads/main" ]] || { echo "LIVE_REFUSED: dispatch from main only"; exit 1; }
          [[ "$MV_APPROVED" =~ ^[0-9a-f]{40}$ ]] || { echo "LIVE_REFUSED: MV_LIVE_APPROVED_REF is not set to a full commit id"; exit 1; }
          [[ "$MV_REF" == "$MV_APPROVED" ]] || { echo "LIVE_REFUSED: ref is not the approved commit"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Database CA (pinned by SHA-256 in the runner)
        run: curl --fail --silent --show-error --proto '=https' --max-time 20 -o "$RUNNER_TEMP/prod-ca-2021.crt" https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
      # Read-only status: only the database URL is passed; no provider secret is read by this step.
      - name: Status (read-only)
        if: inputs.action == 'status'
        env:
          MV_PIPELINE_MODE: ${{ inputs.mode }}
          MV_PIPELINE_DATABASE_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          MV_PIPELINE_LISTINGS: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_LISTINGS || vars.MV_TEST_PIPELINE_LISTINGS }}
          MV_PIPELINE_NOT_BEFORE: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_NOT_BEFORE || vars.MV_TEST_PIPELINE_NOT_BEFORE }}
          MV_PIPELINE_DATABASE_URL: ${{ inputs.mode == 'live' && secrets.MV_LIVE_BOOKING_DATABASE_URL || secrets.E7_DEV_BOOKING_DATABASE_URL }}
        run: node scripts/mv-status.mjs
      - name: Run the pipeline once
        if: inputs.action != 'status'
        env:
          MV_PIPELINE_MODE: ${{ inputs.mode }}
          MV_PIPELINE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MV_PIPELINE_DATABASE_CA_FILE: ${{ runner.temp }}/prod-ca-2021.crt
          MV_PIPELINE_LISTINGS: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_LISTINGS || vars.MV_TEST_PIPELINE_LISTINGS }}
          MV_PIPELINE_NOT_BEFORE: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_NOT_BEFORE || vars.MV_TEST_PIPELINE_NOT_BEFORE }}
          MV_PIPELINE_STRIPE_ACCOUNT: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_STRIPE_ACCOUNT || vars.MV_TEST_PIPELINE_STRIPE_ACCOUNT }}
          MV_PIPELINE_REF_FIELD_ID: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_REF_FIELD_ID || vars.MV_TEST_PIPELINE_REF_FIELD_ID }}
          MV_PIPELINE_TIME_ZONE: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_TIME_ZONE || vars.MV_TEST_PIPELINE_TIME_ZONE }}
          MV_PIPELINE_ACCOUNT_REF: ${{ inputs.mode == 'live' && vars.MV_LIVE_PIPELINE_ACCOUNT_REF || vars.MV_TEST_PIPELINE_ACCOUNT_REF }}
          MV_PIPELINE_STRIPE_KEY: ${{ inputs.mode == 'live' && secrets.MV_LIVE_STRIPE_KEY || secrets.E7_STRIPE_TEST_KEY }}
          MV_PIPELINE_HOSTAWAY_TOKEN: ${{ inputs.mode == 'live' && secrets.MV_LIVE_HOSTAWAY_TOKEN || secrets.E7_HOSTAWAY_TOKEN }}
          MV_PIPELINE_RESEND_KEY: ${{ inputs.mode == 'live' && secrets.MV_LIVE_RESEND_KEY || secrets.E7_RESEND_TEST_KEY }}
          MV_PIPELINE_DATABASE_URL: ${{ inputs.mode == 'live' && secrets.MV_LIVE_BOOKING_DATABASE_URL || secrets.E7_DEV_BOOKING_DATABASE_URL }}
        run: node scripts/mv-pipeline.mjs
